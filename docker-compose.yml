version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: speakle_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only: services reach Postgres over the compose network. Drop the
      # 127.0.0.1 prefix only if host-network access is intended (use a strong password).
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakle_user -d speakle"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis for Django Channels
  redis:
    image: redis:7-alpine
    container_name: speakle_redis
    ports:
      # Loopback only: services reach Redis over the compose network. Redis has no
      # password here, so publishing it beyond the host would expose sessions and cache.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Django Application
  web:
    build: .
    container_name: speakle_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      # Use the named volumes declared below: bind-mounting ./staticfiles and
      # ./media makes Docker create root-owned host dirs on a fresh checkout,
      # and collectstatic then fails as the non-root appuser.
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The python image has no curl, so use Python. urlopen raises on HTTP errors and
      # connection failures, which makes the command exit non-zero. Needs "localhost" in ALLOWED_HOSTS.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: 