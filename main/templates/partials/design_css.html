<style>
:root {
  --primary-gradient: linear-gradient(var(--teal), var(--teal));
  --success-gradient: linear-gradient(var(--teal), var(--teal));
  --warning-gradient: linear-gradient(var(--coral, #e8604a), var(--coral, #e8604a));
  --ink: #1c1915; --ink-soft: #5a5248; --paper: #faf8f5; --surface: #ffffff; --line: #e7e1d8;
  --teal: #17766e; --teal-dark: #145e58; --teal-tint: #effaf8; --coral: #c24517; --coral-tint: #fff4ef;
  --radius: 14px; --shadow: 0 1px 2px rgba(28,25,21,.06), 0 4px 16px rgba(28,25,21,.06);
}
html { scroll-behavior: smooth; }
body { font-family: Figtree, ui-sans-serif, system-ui, sans-serif; background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.55; }
h1, h2, h3, .font-display { font-family: Fraunces, Georgia, serif; letter-spacing: -0.01em; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
.ico { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
::selection { background: #aae4db; color: #0a2624; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
a, button, [role=button], select, input, textarea { -webkit-tap-highlight-color: transparent; }
button, .btn, a.btn { min-height: 44px; }

/* Buttons: one primary (teal), one secondary (outline). */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .7rem 1.25rem; border-radius: 12px; font-weight: 600; transition: background .15s, border-color .15s, transform .15s; cursor: pointer; text-decoration: none; }
.btn-solid { background: var(--teal); color: #fff; border: 1px solid var(--teal); }
.btn-solid:hover { background: var(--teal-dark); }
.btn-outline { background: var(--surface); color: var(--ink); border: 1px solid #cfc6b8; }
.btn-outline:hover { border-color: var(--ink); }
.btn-coral { background: var(--coral); color: #fff; border: 1px solid var(--coral); }
.btn-coral:hover { background: #9c3712; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Legacy classes, restyled so old templates match without edits. */
.btn-primary { background: var(--teal) !important; background-image: none !important; color: #fff !important; border-radius: 12px !important; box-shadow: none !important; }
.btn-primary:hover { background: var(--teal-dark) !important; transform: none !important; }
.btn-primary::before { display: none !important; }
.btn-success { background: var(--teal) !important; background-image: none !important; }
.btn-enhanced { box-shadow: none !important; }
.floating-particles, .particle { display: none !important; }

/* Cards: border only, no ghost shadow, no hover lift. */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

/* Navigation */
.nav-blur { background: rgba(250,248,245,.92) !important; backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); box-shadow: none !important; }
.nav-blur.scrolled { box-shadow: var(--shadow) !important; }
.nav-item::before, .nav-item::after { display: none !important; }
.nav-item { font-weight: 500; color: var(--ink-soft) !important; }
.nav-item:hover, .nav-item.active { color: var(--teal-dark) !important; background: var(--teal-tint); border-radius: 10px; }
.logo-wordmark { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 1.5rem; color: var(--ink); letter-spacing: -0.02em; }
.logo-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--teal); color: #fff; display: grid; place-items: center; }
.notification-badge { box-shadow: none !important; }

/* Strip the gradient + glass hero treatment used across old pages. */
[class*="bg-gradient-to-"] { background-image: none; }
.bg-gradient-to-br:is([class*="from-blue-50"],[class*="from-gray-50"],[class*="from-purple-50"]) { background-color: var(--paper); }
/* Solid accent for filled gradient blocks (avatars, icon tiles, buttons), only from the 400-900 stops. */
:is(.bg-gradient-to-r,.bg-gradient-to-br,.bg-gradient-to-b):is([class*="from-blue-400"],[class*="from-blue-500"],[class*="from-blue-600"],[class*="from-blue-700"],[class*="from-purple-400"],[class*="from-purple-500"],[class*="from-purple-600"],[class*="from-purple-700"],[class*="from-indigo-500"],[class*="from-indigo-600"],[class*="from-indigo-700"]) { background-image: none !important; background-color: var(--teal) !important; }
:is(.bg-gradient-to-r,.bg-gradient-to-br):is([class*="from-green-400"],[class*="from-green-500"],[class*="from-green-600"],[class*="from-emerald-500"],[class*="from-emerald-600"]) { background-image: none !important; background-color: var(--teal) !important; }
:is(.bg-gradient-to-r,.bg-gradient-to-br):is([class*="from-red-500"],[class*="from-red-600"],[class*="from-rose-500"],[class*="from-rose-600"]) { background-image: none !important; background-color: #b42318 !important; }
/* Page hero used by app pages: calm, flat, compact. */
.speakle-hero { background-color: var(--teal-dark) !important; background-image: none !important; }
.speakle-hero > .absolute { display: none !important; }
.speakle-hero .max-w-7xl { padding-top: 2.5rem !important; padding-bottom: 2.5rem !important; }
.speakle-hero h1 { font-size: clamp(2rem, 5vw, 3rem) !important; margin-bottom: .75rem !important; color: #fff; }
.speakle-hero h1 .bg-clip-text { color: #aae4db !important; -webkit-text-fill-color: #aae4db !important; }
.speakle-hero p[class*="text-xl"], .speakle-hero p[class*="text-blue-1"] { color: #d5f2ed !important; font-size: 1.05rem !important; }
.speakle-hero a, .speakle-hero button { background: rgba(255,255,255,.12) !important; background-image: none !important; border: 1px solid rgba(255,255,255,.35) !important; color: #fff !important; padding: .7rem 1.1rem !important; font-size: 1rem !important; border-radius: 12px !important; box-shadow: none !important; }
.speakle-hero a:hover, .speakle-hero button:hover { background: rgba(255,255,255,.22) !important; }
.backdrop-blur-md, .backdrop-blur-sm, .backdrop-blur-lg { backdrop-filter: none !important; }
.bg-clip-text.text-transparent { background: none !important; -webkit-text-fill-color: currentColor !important; color: var(--ink); }
.shadow-2xl, .shadow-xl { box-shadow: var(--shadow) !important; }
.hover\:scale-105:hover { transform: none !important; }

/* Page header used by app pages */
.page-head { padding: 2.25rem 0 1.25rem; }
.page-head h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); line-height: 1.15; font-weight: 600; }
.page-head p { color: var(--ink-soft); max-width: 60ch; margin-top: .5rem; }

/* Forms */
input[type=text], input[type=email], input[type=password], input[type=number], select, textarea { border-radius: 10px; border: 1px solid #cfc6b8; background: #fff; min-height: 44px; }
input:focus, select:focus, textarea:focus { border-color: var(--teal); outline: 3px solid rgba(23,118,110,.25); outline-offset: 0; }
label { font-weight: 600; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
@media (max-width: 640px) { body { font-size: 16px; } .page-head { padding-top: 1.5rem; } }
</style>

<style>
.page-container { background: var(--paper) !important; }
.page-header h1 { background: none !important; -webkit-text-fill-color: var(--ink) !important; color: var(--ink) !important; font-family: "Fraunces", Georgia, serif; }
.chat-item { backdrop-filter: none !important; border: 1px solid var(--line, #e7e0d5) !important; box-shadow: none !important; }
.action-btn.btn-chat, .action-btn.btn-video { color: #fff !important; background: var(--teal) !important; }
.action-btn.btn-video { background: var(--teal-dark) !important; }
.total-unread { box-shadow: none !important; }
</style>
