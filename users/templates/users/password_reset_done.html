{% extends 'base.html' %}
{% block title %}Check your email - Speakle{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col justify-center py-12 px-4">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-6 border border-gray-200 rounded-2xl">
      <h1 class="text-2xl font-bold">Check your email</h1>
      <p class="mt-3 text-gray-700">If an account exists for that address, a reset link is on its way. It can take a minute. Check spam too.</p>
      <a class="btn btn-solid mt-6" href="{% url 'users:login' %}">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
