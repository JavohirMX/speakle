{% extends 'base.html' %}
{% block title %}Password changed - Speakle{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col justify-center py-12 px-4">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-6 border border-gray-200 rounded-2xl">
      <h2 class="text-2xl font-bold">Password changed</h2>
      <p class="mt-3 text-gray-700">You can sign in with your new password now.</p>
      <a class="btn btn-solid mt-6" href="{% url 'users:login' %}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
